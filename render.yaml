databases:
  - name: shihai-store-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"

services:
  - type: web
    name: shihai-digital-store
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shihai-store-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
