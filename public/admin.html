<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾海商城管理后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#182235;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111c2c;color:white;padding:18px}main{max-width:1100px;margin:22px auto;padding:0 14px}.box{background:white;border:1px solid #e7eaf0;border-radius:12px;padding:18px;margin:14px 0}h2{font-size:18px;margin:0 0 14px}.field{width:100%;padding:11px;border:1px solid #dfe4eb;border-radius:8px;margin:5px 0 12px}button{border:0;background:#152238;color:white;border-radius:8px;padding:10px 14px;cursor:pointer}.light{background:#edf0f4;color:#28364b}.danger{background:#a43e3e}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:#b4874d}.hide{display:none}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f3;vertical-align:top}th{background:#f7f8fa}.small{font-size:12px;color:#748094}.item{border:1px solid #e8ebef;padding:12px;border-radius:10px;margin:8px 0}.item img{max-width:90px;max-height:70px;display:block}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px}@media(max-width:600px){.row{grid-template-columns:1fr}main{margin-top:12px}}
</style></head><body><header><b>拾海数字商城 · 管理后台</b><span style="float:right"><a href="/" style="color:#d8c39e">返回商城</a></span></header><main>
<section class="box" id="login"><h2 id="authTitle">管理员初始化</h2><input class="field" id="password" type="password" placeholder="设置后台密码（至少10位）" autocomplete="new-password"><button id="authButton" onclick="setupAdmin()">创建管理员密码</button><p class="small" id="authHint">首次打开请设置后台密码。密码只保存为加盐哈希，不会明文保存。请妥善保管。</p></section>
<div id="app" class="hide"><div class="tabs"><button class="active" onclick="tab('orders',this)">订单管理</button><button onclick="tab('products',this)">商品管理</button><button onclick="tab('settings',this)">商城设置</button><button class="light" onclick="logout()">退出登录</button></div>
<section id="orders" class="box"><h2>订单管理</h2><div class="tablewrap"><table><thead><tr><th>订单</th><th>商品</th><th>付款信息</th><th>客户联系方式</th><th>状态</th><th>交付/备注</th><th>操作</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>
<section id="products" class="box hide"><h2>商品管理</h2><div class="row"><div><label>商品名称</label><input class="field" id="pname"><label>分类</label><input class="field" id="pcat" value="数字商品"><label>价格（元）</label><input class="field" id="pprice" type="number" min="0" step=".01"><label>库存（-1 表示不限）</label><input class="field" id="pstock" type="number" value="-1"></div><div><label>商品描述</label><textarea class="field" id="pdesc" rows="4"></textarea><label>商品图片</label><input class="field" id="pimage" type="file" accept="image/*"><img id="preview" style="max-width:130px;max-height:100px"><label><input type="checkbox" id="pactive" checked> 上架销售</label></div></div><button onclick="saveProduct()">保存商品</button><button class="light" onclick="resetProduct()">清空表单</button><input id="editId" type="hidden"><div id="productList"></div></section>
<section id="settings" class="box hide"><h2>商城设置</h2><label>商城名称</label><input class="field" id="store_name"><label>公告</label><textarea class="field" id="announcement" rows="3"></textarea><div class="row"><div><label>微信收款码图片</label><input class="field" type="file" id="wechatFile" accept="image/*"><img id="wechatPreview" style="max-width:160px"></div><div><label>支付宝收款码图片</label><input class="field" type="file" id="alipayFile" accept="image/*"><img id="alipayPreview" style="max-width:160px"></div></div><button onclick="saveSettings()">保存设置</button></section></div></main>
<script>
const $=id=>document.getElementById(id);let data={},currentImage='',wechat='',alipay='';
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}
async function enterAdmin(endpoint){await api(endpoint,{method:'POST',body:JSON.stringify({password:$('password').value})});$('login').classList.add('hide');$('app').classList.remove('hide');await refresh()}
async function setupAdmin(){try{await enterAdmin('/api/admin/setup')}catch(e){alert(e.message)}}
async function login(){try{await enterAdmin('/api/admin/login')}catch(e){alert(e.message)}}
async function initAuth(){try{const r=await fetch('/api/admin/setup-status');const d=await r.json();if(d.needsSetup){$('authTitle').textContent='首次设置管理员密码';$('authButton').textContent='创建管理员密码';$('authButton').onclick=setupAdmin;$('password').placeholder='设置后台密码（至少10位）';}else{$('authTitle').textContent='管理员登录';$('authButton').textContent='登录';$('authButton').onclick=login;$('password').placeholder='后台密码';$('password').autocomplete='current-password';$('authHint').textContent='仅管理员可访问。请勿在公共设备保存密码。';}}catch(e){$('authHint').textContent='服务器尚未启动，请稍后刷新。';}}
initAuth();
async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}
function tab(id,b){['orders','products','settings'].forEach(x=>$(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function refresh(){data=await api('/api/admin/overview');renderOrders();renderProducts();$('store_name').value=data.settings.store_name||'拾海数字商城';$('announcement').value=data.settings.announcement||'';wechat=data.settings.wechat_qr||'';alipay=data.settings.alipay_qr||'';$('wechatPreview').src=wechat;$('alipayPreview').src=alipay}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)/100).toFixed(2);
function renderOrders(){$('ordersBody').innerHTML=data.orders.map(o=>'<tr><td><b>'+esc(o.order_no)+'</b><div class="small">'+new Date(o.created_at).toLocaleString()+'</div><div>备注码：'+esc(o.remark_code)+'</div></td><td>'+esc(o.product_name)+'<br>× '+o.quantity+'<br>¥'+money(o.total_cents)+'</td><td>'+ (o.payment_method==='wechat'?'微信':'支付宝')+'</td><td>'+esc(o.customer_contact)+'</td><td><select class="field" id="st'+o.id+'">'+['待付款','已付款','采购中','已交付','已退款','异常待核对'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><textarea class="field" id="dn'+o.id+'" placeholder="交付信息">'+esc(o.delivery_note)+'</textarea><textarea class="field" id="an'+o.id+'" placeholder="管理员备注">'+esc(o.admin_note)+'</textarea></td><td><button onclick="saveOrder('+o.id+')">保存</button></td></tr>').join('')}
async function saveOrder(id){try{await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:$('st'+id).value,delivery_note:$('dn'+id).value,admin_note:$('an'+id).value})});alert('订单已更新');await refresh()}catch(e){alert(e.message)}}
function renderProducts(){$('productList').innerHTML='<h3>现有商品</h3>'+data.products.map(p=>'<div class="item"><b>'+esc(p.name)+'</b>　¥'+money(p.price_cents)+'　'+(p.is_active?'上架':'已下架')+'<div class="small">'+esc(p.category)+' · 库存 '+p.stock+'</div><div class="actions"><button onclick="editProduct('+p.id+')">编辑</button><button class="danger" onclick="offProduct('+p.id+')">下架</button></div></div>').join('')}
function resetProduct(){['pname','pcat','pprice','pdesc'].forEach(x=>$(x).value='');$('pstock').value=-1;$('pactive').checked=true;$('editId').value='';currentImage='';$('preview').src=''}
function editProduct(id){const p=data.products.find(x=>x.id===id);$('editId').value=id;$('pname').value=p.name;$('pcat').value=p.category;$('pprice').value=money(p.price_cents);$('pstock').value=p.stock;$('pdesc').value=p.description;$('pactive').checked=p.is_active;currentImage=p.image_data||'';$('preview').src=currentImage;tab('products',document.querySelectorAll('.tabs button')[1]);window.scrollTo(0,0)}
async function fileData(file){if(!file)return '';if(file.size>3*1024*1024)throw Error('图片不能超过3MB');const fd=new FormData();fd.append('file',file);const r=await fetch('/api/admin/upload',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error);return d.data_url}
async function saveProduct(){try{const f=$('pimage').files[0];if(f)currentImage=await fileData(f);const body={name:$('pname').value,category:$('pcat').value,price:$('pprice').value,stock:Number($('pstock').value),description:$('pdesc').value,is_active:$('pactive').checked,image_data:currentImage};const id=$('editId').value;await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(body)});alert('商品已保存');resetProduct();await refresh()}catch(e){alert(e.message)}}
async function offProduct(id){if(!confirm('确认下架该商品？'))return;await api('/api/admin/products/'+id,{method:'DELETE'});await refresh()}
$('pimage').addEventListener('change',e=>{const f=e.target.files[0];if(f)$('preview').src=URL.createObjectURL(f)});
$('wechatFile').addEventListener('change',async e=>{try{wechat=await fileData(e.target.files[0]);$('wechatPreview').src=wechat}catch(x){alert(x.message)}});
$('alipayFile').addEventListener('change',async e=>{try{alipay=await fileData(e.target.files[0]);$('alipayPreview').src=alipay}catch(x){alert(x.message)}});
async function saveSettings(){try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({store_name:$('store_name').value,announcement:$('announcement').value,wechat_qr:wechat,alipay_qr:alipay})});alert('设置已保存');await refresh()}catch(e){alert(e.message)}}
</script></body></html>
