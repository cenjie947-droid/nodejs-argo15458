<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>拾海数字商城</title><style>
:root{--bg:#f5f6f8;--ink:#182235;--muted:#788397;--line:#e8ebf0;--dark:#101827;--gold:#d6ad68;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{background:linear-gradient(135deg,#101827,#23344c);color:#fff;padding:24px 18px 30px}.wrap{max-width:1050px;margin:auto}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:22px;letter-spacing:2px}.brand a{color:#d8c39e;text-decoration:none;font-size:13px}.hero{padding:30px 0 12px}.hero h1{font-size:26px;margin:0 0 9px}.hero p{margin:0;color:#c3cad5;font-size:13px;line-height:1.7}.notice{margin-top:20px;border:1px solid #ffffff26;border-radius:12px;padding:12px;color:#e6d7bd;font-size:12px}.main{max-width:1050px;margin:0 auto;padding:20px 16px 60px}.tools{display:flex;gap:10px;margin-bottom:18px}.tools input{flex:1}.field{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;color:var(--ink);outline:none}.field:focus{border-color:#b9a078}.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 16px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#687386;border-radius:30px;padding:8px 14px}.cat.on{background:var(--dark);color:#fff;border-color:var(--dark)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.pic{height:150px;background:linear-gradient(135deg,#e9edf2,#dce3ec);display:flex;align-items:center;justify-content:center;color:#9aa5b5;font-size:35px}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.info h3{margin:0 0 8px;font-size:16px}.desc{color:var(--muted);font-size:12px;line-height:1.6;min-height:38px}.buyrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.price{font-weight:750;color:#b27b34;font-size:18px}.buy{background:var(--dark);color:#fff;border-radius:8px;padding:9px 13px}.empty{text-align:center;padding:50px 10px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}.panel h2{font-size:18px;margin:0 0 15px}.modal{position:fixed;inset:0;background:#10182799;display:none;align-items:flex-end;justify-content:center;z-index:5;padding:12px}.modal.show{display:flex}.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.sheethead{display:flex;justify-content:space-between;align-items:center}.x{background:#f0f2f5;border-radius:50%;width:32px;height:32px}.formrow{margin:13px 0}.formrow label{display:block;font-size:13px;color:#596579;margin-bottom:7px}.primary{width:100%;padding:13px;border-radius:10px;background:var(--dark);color:#fff;font-weight:650}.muted{font-size:12px;color:var(--muted);line-height:1.7}.paybox{background:#f7f8fa;border-radius:12px;padding:14px;margin:12px 0;text-align:center}.qr{max-width:190px;max-height:190px;object-fit:contain;background:#fff;border-radius:8px}.code{font-size:24px;font-weight:800;letter-spacing:4px;color:#b27b34}.ordercard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}.status{display:inline-block;padding:5px 9px;background:#f5efe4;color:#986b2f;border-radius:20px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pic{height:125px}.info{padding:11px}.info h3{font-size:14px}.hero h1{font-size:23px}}@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><b id="storeName">拾海数字商城</b><a href="#lookup">订单查询 ↗</a></div><div class="hero"><h1>让数字商品触手可及</h1><p>精选数字资源 · 下单后人工核实 · 安全交付</p></div><div class="notice" id="announcement">下单后请按页面提示完成付款。订单需人工核对到账，请勿重复付款。</div></div></header>
<main class="main"><div class="tools"><input id="search" class="field" placeholder="搜索商品名称或关键词"></div><div class="cats" id="cats"></div><div id="products" class="grid"><div class="empty">正在加载商品…</div></div>
<section class="panel" id="lookup"><h2>订单查询</h2><div class="tools"><input id="orderNo" class="field" placeholder="请输入订单号"><button class="buy" onclick="lookupOrder()">查询</button></div><div id="orderResult"></div></section>
<p class="muted" style="text-align:center">本站为人工核账与交付。请以收款账户实际到账为准；备注码仅用于辅助核对，不代表付款成功。</p></main>
<div class="modal" id="buyModal"><div class="sheet"><div class="sheethead"><h2 style="margin:0">确认订单</h2><button class="x" onclick="closeBuy()">✕</button></div><div id="buySummary"></div><div class="formrow"><label>购买数量</label><input class="field" id="qty" type="number" min="1" max="99" value="1"></div><div class="formrow"><label>交付联系方式（邮箱 / Telegram 等）</label><input class="field" id="contact" maxlength="180" placeholder="请填写能联系到你的方式"></div><div class="formrow"><label>支付方式</label><select class="field" id="pay"><option value="wechat">微信支付</option><option value="alipay">支付宝</option></select></div><button class="primary" onclick="createOrder()">提交订单</button><p class="muted">提交订单不代表已付款。请按订单页面显示的金额付款，并以实际到账为准。</p><div id="payResult"></div></div></div>
<script>
let all=[],chosen=null,settings={};
const $=id=>document.getElementById(id), yuan=n=>(Number(n)/100).toFixed(2);
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'请求失败');return d}
async function load(){try{[all,settings]=await Promise.all([api('/api/products'),api('/api/settings/public')]);$('storeName').textContent=settings.store_name||'拾海数字商城';$('announcement').textContent=settings.announcement||'下单后请按页面提示完成付款。订单需人工核对到账，请勿重复付款。';renderCats();render()}catch(e){$('products').innerHTML='<div class="empty">商品加载失败，请稍后刷新</div>'}}
function renderCats(){const cs=['全部',...new Set(all.map(x=>x.category))];$('cats').innerHTML=cs.map((c,i)=>'<button class="cat '+(i===0?'on':'')+'" onclick="filterCat(this,'+JSON.stringify(c).replace(/"/g,'&quot;')+')">'+esc(c)+'</button>').join('')}
let catNow='全部';function filterCat(el,c){catNow=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));el.classList.add('on');render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.toLowerCase();const list=all.filter(p=>(catNow==='全部'||p.category===catNow)&&((p.name+' '+p.description).toLowerCase().includes(q)));$('products').innerHTML=list.length?list.map(p=>'<article class="item"><div class="pic">'+(p.image_data?'<img src="'+p.image_data+'" alt="">':'◈')+'</div><div class="info"><h3>'+esc(p.name)+'</h3><div class="desc">'+esc(p.description||p.category)+'</div><div class="buyrow"><span class="price">¥'+yuan(p.price_cents)+'</span><button class="buy" onclick="openBuy('+p.id+')">立即购买</button></div></div></article>').join(''):'<div class="empty">暂时没有找到相关商品</div>'}
$('search').addEventListener('input',render);
function openBuy(id){chosen=all.find(x=>x.id===id);$('buySummary').innerHTML='<p><b>'+esc(chosen.name)+'</b></p><p class="price">¥'+yuan(chosen.price_cents)+'</p>';$('qty').value=1;$('contact').value='';$('payResult').innerHTML='';$('buyModal').classList.add('show')}
function closeBuy(){$('buyModal').classList.remove('show')}
async function createOrder(){try{const q=Number($('qty').value);if(!Number.isInteger(q)||q<1||q>99)throw Error('数量须为1至99');const o=await api('/api/orders',{method:'POST',body:JSON.stringify({product_id:chosen.id,quantity:q,payment_method:$('pay').value,customer_contact:$('contact').value})});const qr=settings[o.payment_method==='wechat'?'wechat_qr':'alipay_qr'];$('payResult').innerHTML='<div class="paybox"><p>订单已创建，请按金额付款</p><p>订单号：<b>'+esc(o.order_no)+'</b></p><p>付款金额：<b class="price">¥'+yuan(o.total_cents)+'</b></p><p>付款备注码</p><div class="code">'+esc(o.remark_code)+'</div>'+(qr?'<img class="qr" src="'+qr+'" alt="收款码">':'<p class="muted">商家尚未配置此支付方式收款码，请勿付款，联系商家处理。</p>')+'<p class="muted">请在转账备注中填写上方六位码（若支付渠道支持）。备注码不等于到账确认。</p><button class="primary" onclick="copyText(\''+o.order_no+'\')">复制订单号</button><p class="muted">可在首页“订单查询”中查看进度。</p></div>'}catch(e){alert(e.message)}}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('已复制')}catch(e){prompt('请复制订单号',t)}}
async function lookupOrder(){const no=$('orderNo').value.trim();if(!no)return alert('请输入订单号');try{const o=await api('/api/orders/'+encodeURIComponent(no));$('orderResult').innerHTML='<div class="ordercard"><b>'+esc(o.product_name)+'</b><p>数量：'+o.quantity+'　金额：¥'+yuan(o.total_cents)+'</p><span class="status">'+esc(o.status)+'</span><p class="muted">下单时间：'+new Date(o.created_at).toLocaleString()+'</p>'+(o.delivery_note?'<p>交付信息：'+esc(o.delivery_note)+'</p>':'')+'</div>'}catch(e){$('orderResult').textContent=e.message}}
load();
</script></body></html>
